<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>d3-thematika プレイグラウンド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./playground.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">独立プレイグラウンド</p>
        <h1>d3-thematika プレイグラウンド</h1>
      </div>
      <div class="toolbar">
        <label class="toolbar-label" for="example-select">テンプレート</label>
        <select id="example-select">
          <option value="basic">基本地図</option>
          <option value="points">ポイントレイヤー</option>
          <option value="layout">レイアウト実験</option>
        </select>
        <button id="load-example" type="button">読込</button>
        <button id="run-preview" type="button" class="primary">実行</button>
        <button id="reset-state" type="button">リセット</button>
      </div>
    </header>

    <main class="workspace">
      <section class="editors">
        <div class="editor-tabs" role="tablist" aria-label="エディタ">
          <button class="editor-tab" data-panel="html" type="button">HTML</button>
          <button class="editor-tab" data-panel="css" type="button">CSS</button>
          <button class="editor-tab active" data-panel="js" type="button">JS</button>
        </div>

        <section class="editor-panel" data-panel="html">
          <div class="panel-header">
            <h2>HTML</h2>
            <p>プレビューの本文を編集します。コンテナ、ラベル、UI 部品を自由に追加できます。</p>
          </div>
          <textarea id="html-editor" spellcheck="false"></textarea>
        </section>

        <section class="editor-panel" data-panel="css">
          <div class="panel-header">
            <h2>CSS</h2>
            <p>`site` の見た目とは独立して、プレビュー全体のスタイルを調整できます。</p>
          </div>
          <textarea id="css-editor" spellcheck="false"></textarea>
        </section>

        <section class="editor-panel active" data-panel="js">
          <div class="panel-header">
            <h2>JavaScript</h2>
            <p>プレビュー内では `Thematika` と `d3` がそのまま利用できます。</p>
          </div>
          <textarea id="js-editor" spellcheck="false"></textarea>
        </section>
      </section>

      <section class="preview-column">
        <div class="viewer-tabs" role="tablist" aria-label="表示切替">
          <button class="viewer-tab active" data-viewer-panel="preview" type="button">プレビュー</button>
          <button class="viewer-tab" data-viewer-panel="console" type="button">コンソール</button>
        </div>

        <section class="viewer-panel active" data-viewer-panel="preview">
          <iframe
            id="preview-frame"
            title="プレイグラウンドのプレビュー"
            sandbox="allow-scripts allow-same-origin allow-downloads"
          ></iframe>
        </section>

        <section class="viewer-panel console-panel" data-viewer-panel="console">
          <div class="console-header">
            <h2>コンソール</h2>
            <button id="clear-console" type="button">消去</button>
          </div>
          <pre id="console-output"></pre>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./playground.js"></script>
</body>
</html>
